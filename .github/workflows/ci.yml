name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values; never used outside CI.
  CI_ENV_JWT_SECRET: ci-access-secret-0123456789abcdefghijkl
  CI_ENV_JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijk

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Backend check
        run: pnpm --filter @luxa/backend run check
        env:
          # Real-Postgres e2e (test/database.e2e-spec.ts); the database is wiped.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxa_test

      - name: Migrations are complete
        # Fresh DB -> migration:run -> no entity change left without a migration.
        working-directory: apps/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxa_test
          DATABASE_SSL: disable
          JWT_SECRET: ${{ env.CI_ENV_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.CI_ENV_JWT_REFRESH_SECRET }}
          FRONTEND_URL: http://localhost:3000
        run: |
          npm run typeorm -- schema:drop
          npm run migration:run
          npm run migration:check

      - name: Web check (test, lint, typecheck, build)
        run: pnpm --filter @luxa/web run check

  e2e:
    name: e2e
    needs: ci
    # Pinned: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxa_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxa_e2e
      DATABASE_SSL: disable
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API and web
        run: |
          pnpm --filter @luxa/backend run build
          NODE_ENV= pnpm --filter @luxa/web run build

      - name: Migrate
        working-directory: apps/backend
        env:
          JWT_SECRET: ${{ env.CI_ENV_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.CI_ENV_JWT_REFRESH_SECRET }}
        run: npm run migration:run

      - name: Install Chromium
        run: pnpm --filter @luxa/e2e exec playwright install --with-deps chromium

      - name: Playwright smoke
        env:
          JWT_SECRET: ${{ env.CI_ENV_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.CI_ENV_JWT_REFRESH_SECRET }}
        run: pnpm --filter @luxa/e2e run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
