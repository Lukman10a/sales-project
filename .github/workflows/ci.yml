name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luxa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Backend check
        run: pnpm --filter @luxa/backend run check
        env:
          # Real-Postgres e2e (test/database.e2e-spec.ts); the database is wiped.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxa_test

      - name: Migrations are complete
        # Fresh DB -> migration:run -> no entity change left without a migration.
        working-directory: apps/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luxa_test
          DATABASE_SSL: disable
          JWT_SECRET: ci-access-secret-0123456789abcdefghijkl
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdefghijk
          FRONTEND_URL: http://localhost:3000
        run: |
          npm run typeorm -- schema:drop
          npm run migration:run
          npm run migration:check

      - name: Web lint
        run: pnpm --filter @luxa/web run lint